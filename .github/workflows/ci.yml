name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Git identity for test repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/mcpserver
      - name: Conformance suite
        working-directory: tests/conformance
        run: go test ./...
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: OpenCode plugin tests (offline)
        run: adapters/opencode/test/run.sh

  release-build:
    # Builds the release archives of the current commit (not published) and runs the
    # clean-host smoke test on the runner's platform.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./tools/release build -version v0.0.0-ci -out dist
      - run: go run ./tools/release verify -dir dist
      - run: scripts/release/smoke.sh dist linux/amd64
